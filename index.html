<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>NiceDevin音频转换器 — 选择语言 / Choose a language</title>
<meta name="description" content="NiceDevin音频转换器官网：按浏览器语言进入中文或英文页面。">
<style>
:root{
  --bg:#f3f5f8; --card:rgba(255,255,255,.72); --line:rgba(15,30,50,.12);
  --text:#16202b; --muted:rgba(22,32,43,.62);
  --accent:#0F6CBD; --accent-2:#3B8CE8; --glow:rgba(15,108,189,.16);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151b; --card:rgba(28,34,43,.62); --line:rgba(255,255,255,.12);
    --text:#eef2f7; --muted:rgba(238,242,247,.62);
    --accent:#2F86D8; --accent-2:#63ADF5; --glow:rgba(47,134,216,.22);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%;
  display:grid; place-items:center; padding:24px;
  font-family:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(120% 90% at 12% 6%, var(--glow), transparent 62%),
    radial-gradient(100% 80% at 88% 96%, rgba(59,140,232,.10), transparent 60);
}
.card{
  width:min(560px,100%); padding:34px 32px 30px;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 18px 48px rgba(10,25,45,.10);
}
.ico{
  width:44px; height:44px; border-radius:10px; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px var(--glow); margin-bottom:18px;
}
.ico svg{width:24px; height:24px; fill:#fff}
h1{
  margin:0 0 6px; font-size:22px; line-height:1.3; letter-spacing:-.01em; font-weight:600;
}
.sub{
  margin:0 0 26px; font-size:13.5px; line-height:1.6; color:var(--muted);
}
.links{display:flex; flex-wrap:wrap; gap:10px}
a{
  flex:1 1 180px; min-width:0; height:44px; padding:0 18px;
  display:inline-flex; align-items:center; justify-content:space-between; gap:10px;
  text-decoration:none; font-size:14px; font-weight:600;
  border-radius:8px; border:1px solid var(--line); color:var(--text);
  background:rgba(255,255,255,.06); transition:border-color .12s, background .12s;
}
a:first-child{
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  border-color:transparent; color:#fff;
}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.arrow{opacity:.8; font-weight:400}
.foot{
  margin:22px 0 0; font-size:12px; line-height:1.6; color:var(--muted);
}
@media (max-width:460px){
  .card{padding:26px 20px 24px; border-radius:12px}
  h1{font-size:19px}
  a{flex:1 1 100%}
}
</style>
</head>
<body>

<main class="card">
  <div class="ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" role="presentation">
      <rect x="2.5" y="9.5" width="2.6" height="5" rx="1.3"></rect>
      <rect x="7.4" y="5.6" width="2.6" height="12.8" rx="1.3"></rect>
      <rect x="12.3" y="2.6" width="2.6" height="18.8" rx="1.3"></rect>
      <rect x="17.2" y="7.2" width="2.6" height="9.6" rx="1.3"></rect>
    </svg>
  </div>

  <h1>NiceDevin音频转换器</h1>
  <p class="sub">
    中文页面与英文页面各有一个地址，按你的浏览器语言自动进入。<br>
    Chinese and English live on separate addresses; we pick one from your browser language.
  </p>

  <nav class="links" aria-label="语言 / Language">
    <a href="zh-cn/">中文<span class="arrow" aria-hidden="true">&rarr;</span></a>
    <a href="en-us/">English<span class="arrow" aria-hidden="true">&rarr;</span></a>
  </nav>

  <p class="foot">
    站点不收集数据，也没有统计脚本。<br>
    No analytics, no tracking, no third-party scripts.
  </p>
</main>

<script>
(function(){
  var K = "audiolocal-site-lang", l = null;
  try { l = localStorage.getItem(K); } catch(e) { l = null; }
  if (l !== "zh" && l !== "en") {
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    l = /^zh/i.test(n) ? "zh" : "en";
  }
  location.replace(l === "en" ? "en-us/" : "zh-cn/");
})();
</script>
</body>
</html>
